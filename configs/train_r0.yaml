# R0: SSL-MOS (wav2vec2-base) trained on BVCC with MSE. No defense.
config_name: train_r0
task: train_predictor
phase: main
seed: 0
run_name: null
init_ckpt: null

model:
  pretrained: facebook/wav2vec2-base
  freeze_feature_encoder: true
  freeze_encoder: false

data:
  corpus: bvcc
  max_seconds: 6.0       # random training crop; eval uses full audio
  num_workers: 8

train:
  pair_source: none      # none | buffer | noise | pgd
  steps: 8000            # ~13 epochs at batch 8
  batch_size: 8
  pair_batch_size: 8
  lr_encoder: 2.0e-5
  lr_head: 1.0e-3
  weight_decay: 0.01
  warmup_steps: 500
  cosine: true
  grad_clip: 1.0
  w_mse: 1.0
  w_rank: 0.0
  margin: 0.5
  noise_snr_db: [5.0, 30.0]
  pgd: {eps: 0.002, steps: 5, step_size: 0.0005}
  log_every: 25
  eval_every: 500
  select: best           # R0 selected by BVCC val utterance MSE (SSL-MOS recipe)
  pairs_csv: null
  val_pairs_csv: null

eval:
  batch_size: 16
  max_seconds: 20.0
  n_boot: 1000

wandb:
  entity: alialavi
  mode: online
  group: null
