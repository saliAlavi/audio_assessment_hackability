# Baseline: Gaussian-noise pairs (x > x+noise, SNR 5-30 dB), MSE+ranking from R0, budget = 3 H&P rounds.
config_name: baseline_noise
task: train_predictor
phase: main
seed: 0
run_name: null
init_ckpt: ???
model: {pretrained: facebook/wav2vec2-base, freeze_feature_encoder: true, freeze_encoder: false}
data: {corpus: bvcc, max_seconds: 6.0, num_workers: 8}
train:
  pair_source: noise
  steps: 4500
  batch_size: 8
  pair_batch_size: 8
  lr_encoder: 1.0e-05
  lr_head: 0.0001
  weight_decay: 0.01
  warmup_steps: 100
  cosine: false
  grad_clip: 1.0
  w_mse: 1.0
  w_rank: 1.0
  margin: 0.5
  noise_snr_db: [5.0, 30.0]
  pgd: {eps: 0.002, steps: 5, step_size: 0.0005}
  log_every: 25
  eval_every: 500
  select: last
  pairs_csv: null
  val_pairs_csv: null
eval: {batch_size: 16, max_seconds: 20.0, n_boot: 1000}
wandb: {entity: alialavi, mode: online, group: null}
