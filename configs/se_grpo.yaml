# E3: GRPO post-training of the pre-trained enhancement model with an SSL-MOS reward (R0 or R3).
# Hyperparameters validated on VAL by the pilot in docs/e3_pilot.md (run D1). Selection: last.pt (fixed budget).
config_name: se_grpo
task: se_grpo
phase: main
seed: 0
run_name: null
init_ckpt: ???           # se_pretrain best.pt

policy:
  action_bands: 32       # 0: Gaussian over full F×T mask logits | K>0: ERB-band logit offsets on the frozen pre-trained model
  init_log_std: -1.0     # σ ≈ 0.37 in logit space
  min_log_std: -3.0
  max_log_std: 0.0

reward:
  ckpt: ???              # predictor used as the reward (R0 or R3 best.pt)
  pretrained: facebook/wav2vec2-base
  cross_ckpts: {}        # {name: ckpt} fixed held-out predictors scored at every eval

grpo:
  steps: 2500           # ~15 min on one A100 incl. 11 VAL evals
  batch_size: 16         # distinct noisy crops per step
  group_size: 8          # G actions per crop
  crop_seconds: 3.0
  lr: 1.0e-4
  lr_log_std: 1.0e-3
  learn_sigma: true
  betas: [0.9, 0.999]
  ppo_epochs: 2
  clip: 0.2
  adv_eps: 1.0e-4
  grad_clip: 1.0
  kl_mode: loss          # loss: analytic KL(π||π_ref) added to the loss | reward: sample KL subtracted from the reward
  kl_coef: 0.0
  log_every: 10
  eval_every: 250

data:
  train_split: train
  num_workers: 6
  max_train_utts: null
  subset_seed: 0

eval:
  split: val             # all tuning on VAL; the test set is only used by se_eval
  n_utts: 150
  subset_seed: 0
  reference_rows: [noisy, clean]

metrics:
  external: [dnsmos, nisqa, utmos, spk_sim, pesq]
  panel: [estoi, sisdr]
  wer: true
  asr_model: openai/whisper-small

wandb:
  entity: alialavi
  mode: online
  group: null
