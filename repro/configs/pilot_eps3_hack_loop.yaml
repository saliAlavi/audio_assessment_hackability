# Hack-and-Patch: 3 rounds of GRPO latent attack -> label-free detection -> patch.
config_name: hack_loop
task: hack_loop
phase: main
seed: 0
run_name: null
init_ckpt: ???            # R0 checkpoint (same seed)

model:
  pretrained: facebook/wav2vec2-base
  freeze_feature_encoder: true
  freeze_encoder: false

data:
  corpus: bvcc
  max_seconds: 6.0
  num_workers: 8

loop:
  rounds: 3
  pair_preferred: recon   # recon: codec round trip of the input ≻ hacked output
  val_attack_utts: 400    # BVCC val subset attacked each round for val pairs

attack:
  codec: {name: encodec_24khz, quantize: false, encodec_bandwidth: 24.0}
  policy: {hidden: 256, layers: 4, kernel: 5, init_log_std: -1.0}
  action_hop: 25          # latent frames per action step (0 = one time-invariant offset); EnCodec 75 Hz -> 3 Hz
  budget_mode: sphere     # sphere: RMS exactly eps (direction search); ball: RMS <= eps
  eps: 0.5                # RMS budget in per-channel standardized latent units (set by VAL pilot)
  budget_penalty: 1.0     # λ in R - λ·rms²
  group_size: 8
  batch_size: 8
  crop_seconds: 3.0
  steps: 1500
  lr: 3.0e-4
  ppo_epochs: 2
  clip: 0.2
  adv_eps: 1.0e-4
  grad_clip: 1.0
  log_every: 10
  apply:
    n_samples: 3          # stochastic candidates per utterance in addition to the mean action
    batch_size: 16
    chunk_utts: 512
    max_seconds: 20.0

detect:
  tau: 0.3
  measures: [estoi, sisdr, wer, sbs]
  margins: {estoi: 0.02, sisdr: 1.0, wer: 0.0, sbs: 0.02}
  panel_batch: 64

panel:
  device: cuda
  asr_model: openai/whisper-small
  measures: [estoi, sisdr, wer, sbs]

patch:                     # trainer settings for each patch round (same keys as train_r0.train)
  pair_source: buffer
  steps: 1500
  batch_size: 8
  pair_batch_size: 8
  lr_encoder: 1.0e-5
  lr_head: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  cosine: false
  grad_clip: 1.0
  w_mse: 1.0
  w_rank: 1.0
  margin: 0.5
  noise_snr_db: [5.0, 30.0]
  pgd: {eps: 0.002, steps: 5, step_size: 0.0005}
  log_every: 25
  eval_every: 500
  select: last             # fixed budget, no selection on val

eval:
  batch_size: 16
  max_seconds: 20.0
  n_boot: 1000

wandb:
  entity: alialavi
  mode: online
  group: null
